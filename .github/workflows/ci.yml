name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build & bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run build:test
      - run: bun run build:importmap
      # The gem ships these assets. If the build changes them, the committed
      # copies are out of date.
      - run: git diff --exit-code rails/app/assets

  rails-gem:
    name: Rails gem (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4"]
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          working-directory: rails
          bundler-cache: true
      - name: Rails gem tests and RuboCop
        working-directory: rails
        run: |
          bundle exec rake test
          bundle exec rubocop

  demo:
    name: Demo app (Ruby 3.4)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          working-directory: demo
          bundler-cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build the demo bundle
        working-directory: demo
        run: |
          npm install --no-audit --no-fund
          npm run build
      # Renders a document captured from two live editors with Post's
      # nodes: rules.
      - name: Boot and custom-nodes check
        working-directory: demo
        run: |
          bin/rails db:prepare
          bin/rails runner 'Post.first; puts :boot_ok'
          bin/rails runner script/check_custom_nodes.rb

  headless:
    name: Headless durability (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4"]
    steps:
      # Check out lexxy-realtime and yrby side by side. The test server's
      # Gemfile loads yrby from ../../../yrby.
      - uses: actions/checkout@v5
        with:
          path: lexxy-realtime
      - uses: actions/checkout@v5
        with:
          repository: jpcamara/yrby
          path: yrby

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2

      - name: Install JS deps
        working-directory: lexxy-realtime
        run: bun install --frozen-lockfile

      # Build yrby's native extension in place. The test server's bundle
      # loads yrby from that checkout.
      - name: Compile yrby native extension
        working-directory: yrby
        run: |
          bundle install
          bundle exec rake compile

      - name: Install test-server gems
        working-directory: lexxy-realtime/test/server
        run: bundle install

      - name: Headless durability suite
        working-directory: lexxy-realtime
        run: bun run test:headless

  browser:
    name: Browser e2e (real Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Same side-by-side checkout as the headless job, for ../../../yrby.
      - uses: actions/checkout@v5
        with:
          path: lexxy-realtime
      - uses: actions/checkout@v5
        with:
          repository: jpcamara/yrby
          path: yrby

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2

      - name: Install JS deps
        working-directory: lexxy-realtime
        run: bun install --frozen-lockfile

      - name: Compile yrby native extension
        working-directory: yrby
        run: |
          bundle install
          bundle exec rake compile

      - name: Install test-server gems
        working-directory: lexxy-realtime/test/server
        run: bundle install

      # Only the browser suite runs the real editor binding and the splice
      # patch. It drives the runner's preinstalled Chrome with agent-browser.
      - name: Browser e2e suite
        working-directory: lexxy-realtime
        run: |
          export AGENT_BROWSER_EXECUTABLE_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser)"
          bun run test:browser

  anycable:
    name: AnyCable e2e (anycable-go + real Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      # Same side-by-side checkout as the other e2e jobs.
      - uses: actions/checkout@v5
        with:
          path: lexxy-realtime
      - uses: actions/checkout@v5
        with:
          repository: jpcamara/yrby
          path: yrby

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2

      # Download a pinned anycable-go release binary.
      - name: Install anycable-go
        run: |
          curl -fsSL https://github.com/anycable/anycable/releases/download/v1.6.14/anycable-go-linux-amd64 -o /tmp/anycable-go
          sudo install -m 0755 /tmp/anycable-go /usr/local/bin/anycable-go
          anycable-go --version

      - name: Install JS deps
        working-directory: lexxy-realtime
        run: bun install --frozen-lockfile

      - name: Compile yrby native extension
        working-directory: yrby
        run: |
          bundle install
          bundle exec rake compile

      - name: Install test-server gems
        working-directory: lexxy-realtime/test/server
        run: bundle install

      # Runs the headless and browser suites through anycable-go and the RPC
      # server, and checks the @anycable/web consumer.
      - name: AnyCable e2e suite
        working-directory: lexxy-realtime
        run: |
          export AGENT_BROWSER_EXECUTABLE_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser)"
          bun run test:anycable
