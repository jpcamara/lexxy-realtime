<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>lexxy-realtime · import map</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; margin: 2rem; }
      lexxy-editor { display: block; border: 1px solid #ccc; border-radius: 6px; min-height: 8rem; padding: .5rem; }
      [contenteditable] { outline: none; min-height: 6rem; }
    </style>
    <!-- The pins the install generator adds, plus Lexxy's own pin. -->
    <script type="importmap">
      {
        "imports": {
          "lexxy": "/importmap-assets/lexxy.js",
          "@37signals/lexxy": "/importmap-assets/lexxy.js",
          "lexxy-realtime": "/importmap-assets/lexxy-realtime.js",
          "yrby-client": "/importmap-assets/yrby-client.js",
          "yrby-client/element": "/importmap-assets/yrby-client.js",
          "yjs": "/importmap-assets/yjs.js",
          "@rails/actioncable": "/importmap-assets/actioncable.esm.js"
        }
      }
    </script>
  </head>
  <body>
    <script>
      window.__err = [];
      // Yjs reports a second copy on the page with console.error.
      window.__consoleErrors = [];
      const consoleError = console.error;
      console.error = (...args) => {
        window.__consoleErrors.push(args.map(String).join(" "));
        consoleError(...args);
      };
      addEventListener("error", (e) => window.__err.push(String((e.error && e.error.stack) || e.message)));
      addEventListener("unhandledrejection", (e) => window.__err.push("unhandledrejection: " + String((e.reason && e.reason.stack) || e.reason)));
    </script>
    <h1>lexxy-realtime over an import map</h1>
    <!-- The markup the Rails helper renders: the elements declared in HTML
         with attributes, upgraded when the modules register them. -->
    <yrby-document name="body" channel="DocumentChannel">
      <lexxy-editor id="editor" name="editor">
        <lexxy-collaboration></lexxy-collaboration>
      </lexxy-editor>
    </yrby-document>
    <script>
      // A unique room per run and a name per session, set before the
      // deferred modules register and upgrade the elements.
      const params = new URLSearchParams(location.search);
      const room = params.get("room") || "importmap-check";
      const collabEl = document.querySelector("lexxy-collaboration");
      collabEl.setAttribute("doc-id", room);
      collabEl.setAttribute("name", params.get("name") || "User");
      document.querySelector("yrby-document").setAttribute("grant", room);
    </script>
    <script type="module">
      import "@37signals/lexxy";
      import { setConsumer } from "lexxy-realtime";
      import { $createActionTextAttachmentNode, Lexical } from "@37signals/lexxy";
      // The app's own imports of the shared modules, next to lexxy-realtime's.
      import { DocumentSessionStore } from "yrby-client";
      import { YrbyDocumentElement } from "yrby-client/element";
      import * as Y from "yjs";
      const { $getRoot } = Lexical;

      const editor = document.getElementById("editor");
      const collab = document.querySelector("lexxy-collaboration");

      window.__test = {
        synced: () => !!collab.provider?.synced,
        text: () => editor.querySelector("[contenteditable]")?.innerText ?? "",
        docRoot: () => (collab.doc?.share.get("root") ? collab.doc.share.get("root").toString() : ""),
        peers: () => [...(collab.awareness?.getStates().values() ?? [])].map((s) => s.name).filter(Boolean),
        errors: () => window.__err,
        // One yrby-client: the registered <yrby-document> class is the one
        // the app imports, setConsumer reaches it, and the element's
        // session lives in the store the app's DocumentSessionStore sees.
        oneYrbyClient: () => {
          const yrbyDocument = document.querySelector("yrby-document");
          const session = yrbyDocument.session;
          return (
            customElements.get("yrby-document") === YrbyDocumentElement &&
            yrbyDocument instanceof YrbyDocumentElement &&
            !!session &&
            DocumentSessionStore.for(session.store.consumer) === session.store &&
            session.store.sessions.includes(session)
          );
        },
        setConsumerReachesElement: () => {
          const original = YrbyDocumentElement.consumer;
          const marker = { subscriptions: { create() {} } };
          setConsumer(marker);
          const reached = YrbyDocumentElement.consumer === marker;
          YrbyDocumentElement.consumer = original;
          return reached;
        },
        // One yjs: the bound doc is an instance of the app's Y.Doc, and
        // Yjs never reported a second copy.
        oneYjs: () =>
          collab.doc instanceof Y.Doc &&
          !window.__consoleErrors.some((m) => m.includes("Yjs was already imported")),
        // Insert an attachment through the pinned modules: $getRoot from
        // Lexxy's Lexical re-export operating inside an editor built by the
        // same pin. lexxy-realtime's bundle reaches the identical copy
        // through its shim; a duplicate lexical fails here with a class
        // identity error.
        insertAttachment: (sgid) => {
          try {
            editor.editor.update(() => {
              const node = $createActionTextAttachmentNode({
                sgid,
                src: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==",
                contentType: "image/png",
                fileName: "importmap.png",
                previewable: true,
              });
              $getRoot().append(node);
            }, { discrete: true });
            return "ok";
          } catch (e) {
            return "ERR: " + e.message;
          }
        },
        attachmentSgids: () => {
          const json = JSON.stringify(editor.editor.getEditorState().toJSON());
          return [...json.matchAll(/"sgid":"([^"]+)"/g)].map((m) => m[1]);
        },
      };
    </script>
  </body>
</html>
