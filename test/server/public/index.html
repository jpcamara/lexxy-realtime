<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>lexxy-realtime · yrby test</title>
    <link rel="stylesheet" href="/lexxy-css/lexxy-variables.css" />
    <link rel="stylesheet" href="/lexxy-css/lexxy.css" />
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; margin: 2rem; }
      lexxy-editor { display: block; border: 1px solid #ccc; border-radius: 6px; min-height: 8rem; padding: .5rem; }
      [contenteditable] { outline: none; min-height: 6rem; }
    </style>
  </head>
  <body>
    <script>
      window.__err = [];
      addEventListener("error", (e) => window.__err.push(String((e.error && e.error.stack) || e.message)));
      addEventListener("unhandledrejection", (e) => window.__err.push("unhandledrejection: " + String((e.reason && e.reason.stack) || e.reason)));
    </script>
    <h1>lexxy-realtime · yrby</h1>
    <script>
      // Writes the markup the Rails helper renders, before the custom
      // elements upgrade: <yrby-document> around the editor and
      // <lexxy-collaboration> inside it. seedHtml stands in for an existing
      // Action Text body, which Lexxy reads from the value attribute.
      // mode=host renders a bare editor, and app.js assigns a doc and
      // provider to the element itself.
      (() => {
        const params = new URLSearchParams(location.search);
        const attr = (value) => String(value).replace(/&/g, "&amp;").replace(/"/g, "&quot;");
        const room = params.get("room") || "browser-demo";
        const seedHtml = params.get("seedHtml");
        const editorAttributes =
          'id="editor" name="editor" data-direct-upload-url="/rails/active_storage/direct_uploads" ' +
          'data-blob-url-template="/rails/active_storage/blobs/redirect/:signed_id/:filename"' +
          (seedHtml ? ` value="${attr(seedHtml)}"` : "");
        if (params.get("mode") === "host") {
          document.write(`<lexxy-editor ${editorAttributes}></lexxy-editor>`);
          return;
        }
        const refresh = params.get("refresh");
        document.write(
          `<yrby-document grant="${attr(params.get("grant") || room)}" name="body" channel="DocumentChannel"` +
            (refresh ? ` refresh="${attr(refresh)}"` : "") +
            `><lexxy-editor ${editorAttributes}>` +
            `<lexxy-collaboration doc-id="${attr(room)}" name="${attr(params.get("name") || "User")}" ` +
            `color="${attr(params.get("color") || "#3b82f6")}"></lexxy-collaboration>` +
            "</lexxy-editor></yrby-document>"
        );
      })();
    </script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
