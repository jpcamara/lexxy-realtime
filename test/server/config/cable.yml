# Async adapter: in-process pub/sub, fine for a single-process test server.
# The AnyCable leg boots with CABLE_ADAPTER=any_cable, which routes
# broadcasts through AnyCable's adapter to anycable-go instead.
development:
  adapter: <%= ENV.fetch("CABLE_ADAPTER", "async") %>
production:
  adapter: <%= ENV.fetch("CABLE_ADAPTER", "async") %>
